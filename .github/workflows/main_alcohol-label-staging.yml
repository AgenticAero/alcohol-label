# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - alcohol-label-staging

on:
  push:
    branches: [main]
    # Documentation-only pushes do not change what is deployed.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pipx install poetry==2.2.1 && pipx inject poetry poetry-plugin-export

      - name: Install dependencies and run checks
        run: |
          poetry install
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run pytest

      # Built here so App Service must not run an Oryx build (SCM_DO_BUILD_DURING_DEPLOYMENT unset).
      - name: Vendor runtime dependencies from poetry.lock
        run: |
          poetry export --only main --without-hashes -o runtime-requirements.txt
          pip install --no-cache-dir --target .python_packages/lib/site-packages -r runtime-requirements.txt

      # One job avoids artifact storage, which hit its quota on the first run.
      - name: Assemble deployment package
        run: |
          mkdir dist
          cp -r src .python_packages pyproject.toml dist/
          find dist -name __pycache__ -type d -prune -exec rm -rf {} +

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8C746AA11F584109B0BDD53B6716C609 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_686F5333A65E47F98663DC6302634922 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DDB53F8FA1E6472A9A2656C41D656DB2 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'alcohol-label-staging'
          slot-name: 'Production'
          package: dist
          